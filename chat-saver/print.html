<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat Saver — Print view</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; max-width: 760px; margin: 0 auto; padding: 24px; color: #111; line-height: 1.55; }
  .toolbar { background: #eef4fb; border: 1px solid #bcd4ea; border-radius: 8px; padding: 12px; margin-bottom: 20px; }
  .toolbar button { background: #2b7cd3; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 1rem; cursor: pointer; }
  .msg { border-top: 1px solid #ddd; padding: 12px 0; }
  .msg h2 { font-size: 1rem; color: #2b7cd3; margin: 0 0 6px; }
  .msg pre { background: #f4f4f4; padding: 10px; overflow-x: auto; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
  .msg code { background: #f0f0f0; padding: 1px 4px; border-radius: 4px; }
  .msg pre code { background: none; padding: 0; }
  .msg table { border-collapse: collapse; margin: 8px 0; }
  .msg th, .msg td { border: 1px solid #bbb; padding: 6px 10px; text-align: left; }
  .msg img { max-width: 100%; }
  .meta { color: #555; font-size: .9rem; }
  @media print {
    .toolbar { display: none; }
    body { max-width: none; padding: 0; }
    .msg { break-inside: avoid-page-break-inside; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <strong>Chat Saver — print view</strong>
    <p class="meta">Use the button below, then choose <b>Save as PDF</b> in the print dialog. The text stays selectable in the PDF.</p>
    <button id="printBtn">Print / Save as PDF</button>
  </div>
  <h1 id="title"></h1>
  <p class="meta" id="source"></p>
  <div id="messages"></div>
  <script src="print.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { font: 14px system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; color: #111; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .count { color: #444; margin-bottom: 10px; }
  button { display: block; width: 100%; margin: 4px 0; padding: 8px; border-radius: 8px; border: 1px solid #2b7cd3; background: #2b7cd3; color: #fff; font-size: 14px; cursor: pointer; }
  button.ghost { background: #fff; color: #2b7cd3; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 12px; color: #555; margin-top: 8px; }
  .err { color: #b3261e; font-size: 13px; }
</style>
</head>
<body>
  <h1>Chat Saver</h1>
  <div class="count" id="count">Open a ChatGPT or Claude chat, then open this popup.</div>
  <button id="mdBtn">Save as Markdown</button>
  <button id="pdfBtn">Save as PDF</button>
  <button id="allBtn" class="ghost">Select all messages</button>
  <button id="clearBtn" class="ghost">Clear selection</button>
  <button id="showBtn" class="ghost">Show toolbar on page</button>
  <div class="hint">Click a message on the page to select it. With nothing selected, the whole chat is saved. Nothing leaves your browser.</div>
  <div class="err" id="err"></div>
  <script src="popup.js"></script>
</body>
</html>
